app-id: io.github.labbots.NiimPrintX
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: niimprintx
finish-args:
  - --share=ipc
  - --socket=x11
  - --share=network
  - --system-talk-name=org.bluez
  - --filesystem=host
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

modules:
  - name: imagemagick
    config-opts:
      - --enable-shared
      - --disable-static
      - --disable-docs
      - --with-modules
      - --with-threads
    sources:
      - type: archive
        url: https://github.com/ImageMagick/ImageMagick/archive/7.1.2-21.tar.gz
        sha256: 4ba5b81797910efa93e65fb5a02b496284b8069d64513c6d2687c80d180dd70f
        x-checker-data:
          type: anitya
          project-id: 1372
          stable-only: true
          url-template: https://github.com/ImageMagick/ImageMagick/archive/$version.tar.gz
    cleanup:
      - /bin/*-config

  # flatpak-builder-tools/poetry/flatpak-poetry-generator.py -o python3-poetry.json poetry.lock
  # XXX: modules matching pyobjc*, ruff, win32* and winrt* were manually removed
  - python3-poetry.json

  - name: NiimPrintX
    buildsystem: simple
    build-commands:
      - cp -r NiimPrintX/ /app/lib/python3.12/site-packages/
      - install -Dm755 assets/linux/niimprintx /app/bin/niimprintx
      - install -Dm755 niimprintx-ui /app/bin/niimprintx-ui
      - install -Dm755 niimprintx-cli /app/bin/niimprintx-cli
      - install -Dm755 bluetoothctl /app/bin/bluetoothctl
      - install -Dm644 -t /app/share/applications/ assets/linux/${FLATPAK_ID}.desktop
      - install -Dm644 assets/linux/${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 assets/linux/${FLATPAK_ID}.mime.xml /app/share/mime/packages/${FLATPAK_ID}.mime.xml
      - |
        for i in {128,256,512} ; do
          install -Dm644 ./NiimPrintX/ui/assets/icon.iconset/icon_${i}x${i}.png /app/share/icons/hicolor/${i}x${i}/apps/${FLATPAK_ID}.png ;
        done;

    sources:
      - type: git
        url: https://github.com/Avicennasis/NiimPrintX.git
        commit: 99e9e2635f5107a7a17ce2c622500c9211207a56
      - type: script
        dest-filename: niimprintx-ui
        commands:
          - python -m NiimPrintX.ui
      - type: script
        dest-filename: niimprintx-cli
        commands:
          - python -m NiimPrintX.cli
      # Work-around warning:
      # WARNING:root:Could not determine BlueZ version, bluetoothctl not available, assuming 5.51+
      - type: script
        dest-filename: bluetoothctl
        commands:
          - echo "bluetoothctl: 5.99"

